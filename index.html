<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Money Machine</title>
<meta name="theme-color" content="#fafafa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* shadcn/ui tokens (zinc) */
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #09090b;
    --text2: #71717a;
    --green: #059669;
    --blue: #18181b;
    --red: #ef4444;
    --border: #e4e4e7;
    --ring: #18181b;
    --shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
    transition: opacity .5s ease, transform .5s cubic-bezier(.32,.72,0,1);
  }
  .screen.hidden { opacity: 0; transform: scale(.96); pointer-events: none; }

  /* ============ SETUP ============ */
  #setup { max-width: 520px; margin: 0 auto; }
  .setup-title { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
  .setup-sub { font-size: 17px; color: var(--text2); margin-top: 8px; text-align: center; }
  .products {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: 36px; width: 100%;
  }
  .product {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 8px 14px; text-align: center; cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.32,.72,0,1), border-color .2s, box-shadow .2s;
  }
  .product:hover { transform: translateY(-3px); border-color: #d4d4d8; }
  .product:active { transform: scale(.95); }
  .product.sel { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
  .product .em { font-size: 34px; }
  .product .nm { font-size: 13px; font-weight: 600; margin-top: 8px; }
  .product .pr { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .name-row { display: flex; gap: 10px; margin-top: 28px; width: 100%; }
  .name-row input {
    flex: 1; font-size: 15px; font-weight: 500; padding: 13px 16px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    box-shadow: var(--shadow); outline: none; font-family: inherit; color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .name-row input:focus { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
  .name-row input::placeholder { color: var(--text2); }
  .dice {
    width: 50px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    box-shadow: var(--shadow); font-size: 20px; cursor: pointer;
    transition: transform .25s, background .15s;
  }
  .dice:hover { background: #f4f4f5; }
  .dice:active { transform: rotate(180deg) scale(.9); }
  .launch {
    margin-top: 28px; width: 100%; padding: 15px; border: none; border-radius: 8px;
    background: var(--blue); color: #fafafa; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; letter-spacing: -0.01em;
    box-shadow: var(--shadow);
    transition: transform .2s, opacity .2s, background .2s;
  }
  .launch:hover { background: #27272a; }
  .launch:active { transform: scale(.97); }
  .launch:disabled { opacity: .4; pointer-events: none; }

  /* ============ DASHBOARD ============ */
  #dash { justify-content: flex-start; padding-top: max(28px, env(safe-area-inset-top)); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--text2); }
  .mute {
    position: fixed; top: max(16px, env(safe-area-inset-top)); z-index: 11;
    width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); box-shadow: var(--shadow); font-size: 17px;
    cursor: pointer; transition: transform .2s;
  }
  .mute:active { transform: scale(.9); }
  .brand .b-em { font-size: 20px; }
  .brand .live {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .balance-wrap { margin-top: 7vh; text-align: center; position: relative; }
  .balance-label { font-size: 14px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; }
  #balance {
    font-size: clamp(52px, 11vw, 88px); font-weight: 700; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; margin-top: 6px;
    transition: transform .15s ease, color .3s ease, text-shadow .3s ease;
  }
  #balance.bump {
    transform: scale(1.05);
    color: var(--green);
    text-shadow: 0 0 28px rgba(5,150,105,.35);
  }
  /* карточки статистики: вы / конкурент — плоская «дашборд-зона» */
  .statcards { display: flex; gap: 8px; width: 100%; max-width: 420px; margin: 14px auto 0; }
  .sc {
    flex: 1; background: #f4f4f5; border: none; border-radius: 12px;
    padding: 13px 15px; text-align: left; min-width: 0;
  }
  .sc-label {
    font-size: 10px; font-weight: 600; color: var(--text2); text-transform: uppercase;
    letter-spacing: .04em; display: flex; align-items: center; gap: 5px;
    white-space: nowrap; overflow: hidden; height: 14px; line-height: 14px;
  }
  .sc-label .ahead { color: var(--green); }
  .sc-label .behind { color: var(--red); }
  .sc-main { font-size: 20px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-sub { font-size: 12px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-sub b { color: var(--text); font-weight: 600; }

  /* floating +$ */
  .float-money {
    position: absolute; left: 50%; top: -6px;
    font-size: 24px; font-weight: 800; color: var(--green);
    pointer-events: none; white-space: nowrap;
    text-shadow: 0 2px 14px rgba(5,150,105,.45);
    animation: floatUp 1.5s cubic-bezier(.2,.6,.3,1) forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 14px) rotate(var(--rot, 0deg)) scale(.5); }
    12% { opacity: 1; transform: translate(-50%, -10px) rotate(var(--rot, 0deg)) scale(1.25); }
    28% { transform: translate(-50%, -22px) rotate(var(--rot, 0deg)) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -95px) rotate(var(--rot, 0deg)) scale(.95); }
  }

  /* потоки дохода — плоские плитки, не кнопки */
  .streams {
    display: none; /* TODO временно скрыто — вернуть на flex */
    gap: 8px; width: 100%; max-width: 420px; margin-top: 8px;
  }
  .scol {
    flex: 1; background: #f4f4f5; border: none; border-radius: 12px;
    padding: 13px 6px 16px; text-align: center; position: relative; overflow: hidden;
  }
  .scol .s-em { font-size: 20px; line-height: 1; }
  .scol .s-name { font-size: 9.5px; font-weight: 600; color: var(--text2); margin-top: 5px; letter-spacing: .01em; line-height: 1.1; }
  .scol .s-rpm { font-size: 12px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .scol .s-bar { height: 4px; }
  .scol .s-bar {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
    transform: scaleX(0); transform-origin: left; transition: transform .5s ease;
  }
  .scol.hit { animation: scolHit .5s ease-out; }
  @keyframes scolHit {
    0% { box-shadow: var(--shadow), 0 0 0 0 var(--scol, rgba(5,150,105,.5)); }
    100% { box-shadow: var(--shadow), 0 0 0 7px rgba(5,150,105,0); }
  }

  /* feed */
  .feed {
    flex: 1; width: 100%; max-width: 420px; margin-top: 16px;
    overflow: hidden; position: relative; padding-top: 12px;
    -webkit-mask-image: linear-gradient(to bottom, black 78%, transparent);
    mask-image: linear-gradient(to bottom, black 78%, transparent);
  }
  .pay {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    box-shadow: var(--shadow); margin-bottom: 8px;
    animation: slideIn .55s cubic-bezier(.32,.72,0,1), payGlow 1.2s ease-out;
  }
  .pay.jp { animation: slideIn .55s cubic-bezier(.32,.72,0,1); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  @keyframes payGlow {
    0% { background: #ecfdf5; border-color: #6ee7b7; box-shadow: 0 0 0 3px rgba(5,150,105,.12); }
    100% { background: var(--card); border-color: var(--border); box-shadow: var(--shadow); }
  }
  .pay .amt { animation: amtPop .55s cubic-bezier(.34,1.56,.64,1); }
  @keyframes amtPop {
    0% { transform: scale(.4); opacity: 0; }
    60% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); }
  }
  .pay .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #fff; flex-shrink: 0;
  }
  .pay .info { flex: 1; min-width: 0; }
  .pay .who { font-size: 14px; font-weight: 600; }
  .pay .what { font-size: 12px; color: var(--text2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pay .amt { font-size: 16px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }

  /* upgrades */
  .upgrades {
    display: flex; gap: 12px; width: 100%; max-width: 420px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .upg {
    flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 12px; text-align: left; cursor: pointer; min-width: 0;
    box-shadow: var(--shadow); font-family: inherit;
    transition: transform .2s cubic-bezier(.32,.72,0,1), opacity .2s, background .15s;
  }
  .upg:hover:not(:disabled) { background: #f4f4f5; }
  .upg:active { transform: scale(.95); }
  .upg:disabled { opacity: .45; pointer-events: none; }
  .upg .u-top { display: flex; justify-content: space-between; align-items: center; }
  .upg .u-name { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .upg .u-cost { white-space: nowrap; }
  .upg.cooldown { opacity: .5; pointer-events: none; }
  .upg .u-lvl { font-size: 11px; font-weight: 600; color: var(--text); background: #f4f4f5; border: 1px solid var(--border); padding: 2px 8px; border-radius: 9999px; }
  .upg .u-cost { font-size: 13px; color: var(--text2); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .upg .u-eff { font-size: 11px; color: var(--green); font-weight: 600; margin-top: 2px; }
  .upg.ready { border-color: #6ee7b7; animation: readyPulse 1.8s ease-in-out infinite; }
  .upg.ready .u-cost { color: var(--green); font-weight: 600; }
  @keyframes readyPulse {
    0%, 100% { box-shadow: var(--shadow), 0 0 0 0 rgba(5,150,105,.28); }
    50% { box-shadow: var(--shadow), 0 0 0 6px rgba(5,150,105,0); }
  }
  .upg.flash { animation: flash .4s; }
  @keyframes flash { 50% { box-shadow: 0 0 0 3px rgba(52,199,89,.4); } }

  /* event banner */
  #event {
    display: flex; align-items: center; gap: 12px;
    width: 100%; max-width: 420px; margin-top: 16px;
    padding: 11px 14px; border-radius: 10px;
    background: var(--card); box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    transition: border-color .3s ease;
  }
  #event .e-chip {
    width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    background: #f4f4f5;
  }
  #event.good .e-chip { background: #ecfdf5; }
  #event.bad  .e-chip { background: #fef2f2; }
  #event.good { border-color: #6ee7b7; }
  #event.bad  { border-color: #fca5a5; }
  #event .e-em { font-size: 19px; }
  #event .e-txt { flex: 1; font-size: 13px; font-weight: 600; line-height: 1.3; }
  #event.idle .e-txt { color: var(--text2); font-weight: 500; }
  #event .e-mult { font-size: 14px; font-weight: 700; white-space: nowrap; }
  #event.good .e-mult { color: var(--green); }
  #event.bad  .e-mult { color: var(--red); }
  #event .e-bar {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
    transform-origin: left; transform: scaleX(0);
  }
  #event.good .e-bar { background: var(--green); }
  #event.bad  .e-bar { background: var(--red); }

  /* джекпот */
  .pay.jp { border-color: #f59e0b; background: #fffbeb; box-shadow: 0 0 0 1px rgba(245,158,11,.25); }
  .pay.jp .amt { color: #d97706; }
  .pay.jp .what { color: #b45309; }

  /* конкурент */
  .rival { margin-top: 12px; font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .rival b { color: var(--text); font-weight: 600; }
  .rival .ahead { color: var(--green); font-weight: 600; }
  .rival .behind { color: var(--red); font-weight: 600; }

  /* прогресс до IPO */
  .ipo-prog {
    width: 220px; height: 6px; border-radius: 9999px; background: #e4e4e7;
    margin: 14px auto 0; overflow: hidden;
  }
  .ipo-prog > div { height: 100%; width: 0%; background: var(--text); border-radius: 9999px; transition: width .6s ease; }
  .ipo-label { font-size: 12px; color: var(--text2); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* IPO overlay */
  #ipo {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(250,250,250,.92); backdrop-filter: blur(8px);
  }
  #ipo.show { display: flex; }
  .ipo-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15); padding: 36px 32px; max-width: 380px;
    width: calc(100% - 48px); text-align: center;
    animation: slideIn .6s cubic-bezier(.32,.72,0,1);
  }
  .ipo-card .big { font-size: 56px; }
  .ipo-card h2 { font-size: 22px; font-weight: 700; margin-top: 10px; letter-spacing: -0.02em; }
  .ipo-card p { font-size: 14px; color: var(--text2); margin-top: 10px; line-height: 1.5; }
  .ipo-card .launch { margin-top: 24px; }
  #memePrev {
    width: 100%; border-radius: 10px; margin-top: 16px;
    border: 1px solid var(--border); display: block;
  }
  .share-row { display: flex; gap: 8px; margin-top: 10px; }
  .share-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); cursor: pointer; text-decoration: none;
    font: 600 13px "Inter", -apple-system, sans-serif; color: var(--text);
    transition: background .15s, transform .15s;
  }
  .share-btn:hover { background: #f4f4f5; }
  .share-btn:active { transform: scale(.96); }
  .share-btn svg { flex-shrink: 0; }

  /* зал славы */
  .lb { margin-top: 26px; width: 100%; display: none; }
  .lb-title { font-size: 13px; font-weight: 600; color: var(--text2); text-align: center; margin-bottom: 8px; }
  .lb-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px; font-size: 13px;
  }
  .lb-row .l-em { font-size: 16px; }
  .lb-row .l-name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-row .l-time { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* футер */
  .footer {
    position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--text2); z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .footer a {
    color: var(--text2); pointer-events: auto; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .footer a:hover { color: var(--text); }
  #dash .upgrades { padding-bottom: max(34px, env(safe-area-inset-bottom)); }

  /* milestone toast */
  #toast {
    position: fixed; top: 18px; left: 50%; transform: translate(-50%, -150%);
    background: var(--card); color: var(--text); font-size: 14px; font-weight: 600;
    padding: 12px 20px; border-radius: 10px; z-index: 10;
    border: 1px solid var(--border);
    transition: transform .55s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  #toast.show { transform: translate(-50%, 0); }

  /* confetti */
  .confetti {
    position: fixed; width: 8px; height: 8px; top: -10px; z-index: 9;
    pointer-events: none; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx, 0px), 110vh) rotate(var(--spin, 720deg)); opacity: .6; }
  }

  /* тряска экрана на джекпот */
  #dash.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    0%, 100% { transform: none; }
    15% { transform: translate(-7px, 3px) rotate(-.5deg); }
    35% { transform: translate(6px, -3px) rotate(.5deg); }
    55% { transform: translate(-4px, 2px) rotate(-.3deg); }
    75% { transform: translate(3px, -1px); }
  }
</style>
</head>
<body>

<!-- SETUP -->
<div class="screen" id="setup">
  <div class="setup-title" id="stTitle">Become the next OpenAI</div>
  <div class="setup-sub" id="stSub">The AGI race is on. Everyone's torching billions on GPUs — now it's your turn. Pick your angle.</div>
  <div class="setup-sub" id="multBadge" style="display:none; color: var(--green); font-weight: 600"></div>
  <div class="products" id="products"></div>
  <div class="name-row">
    <input id="nameInput" placeholder="Company name" maxlength="36" autocomplete="off">
    <button class="dice" id="dice" title="Generate">🎲</button>
  </div>
  <button class="launch" id="launch" disabled>Launch 🚀</button>
  <div class="lb" id="lb">
    <div class="lb-title" id="lbTitleEl">🏆 Hall of Fame — fastest IPOs</div>
    <div id="lbRows"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="screen hidden" id="dash">
  <div class="brand"><span class="live"></span><span class="b-em" id="bEm"></span><span id="bName"></span></div>
  <div class="balance-wrap" id="balWrap">
    <div class="balance-label" id="balLabel">Balance</div>
    <div id="balance">$0</div>
    <div class="ipo-prog"><div id="ipoBar"></div></div>
    <div class="ipo-label" id="ipoLabel"></div>
  </div>
  <div class="statcards">
    <div class="sc">
      <div class="sc-label" id="youLabel">You</div>
      <div class="sc-main" id="rpm">$0/min</div>
      <div class="sc-sub"><b id="sales">0</b> <span id="salesLabel">sales</span></div>
    </div>
    <div class="sc">
      <div class="sc-label" id="rivalLabel">🤖 Rival · <span id="rivalState"></span></div>
      <div class="sc-main" id="rivalBal2">$0</div>
      <div class="sc-sub" id="rivalName2"></div>
    </div>
  </div>
  <div class="streams" id="streams"></div>
  <div id="event" class="idle">
    <span class="e-chip"><span class="e-em">📡</span></span>
    <span class="e-txt">Market's quiet. Waiting for the next plot twist…</span>
    <span class="e-mult"></span>
    <div class="e-bar"></div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="upgrades">
    <button class="upg" id="upgSpeed">
      <div class="u-top"><span class="u-name">🎛 GPUs</span><span class="u-lvl">×1</span></div>
      <div class="u-cost"></div>
      <div class="u-eff">+22% users</div>
    </button>
    <button class="upg" id="upgPrice">
      <div class="u-top"><span class="u-name">🧠 Release</span><span class="u-lvl">v1</span></div>
      <div class="u-cost"></div>
      <div class="u-eff">+55% per check</div>
    </button>
    <button class="upg" id="upgHype">
      <div class="u-top"><span class="u-name">🎤 DevDay</span><span class="u-lvl">⚡</span></div>
      <div class="u-cost"></div>
      <div class="u-eff">×4 hype · 12s</div>
    </button>
  </div>
</div>

<div id="ipo">
  <div class="ipo-card">
    <div class="big">🔔</div>

// жирность масштабируется от суммы чека: $100 → лёгкий тик, $100k → удар в грудь
function sndCoin(amt) {
  if (sfxMuted || !actx) return;
  const t0 = actx.currentTime;
  // вес чека: 0 при ~$100, 1 при ~$100k (лог-шкала)
  const w = Math.min(1, Math.max(0, (Math.log10(amt || 100) - 2) / 3));
  const v = (1 - w * 0.25) * (1 + (Math.random() - 0.5) * 0.12); // крупный чек = ниже питч

  // если есть coin.mp3 — играем его (питч и громкость от суммы чека)
  if (coinBuf) {
    const src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = coinBuf;
    src.playbackRate.value = v;
    g.gain.value = 0.5 + w * 0.5;
    src.connect(g); g.connect(actx.destination);
    src.start(t0);
    if (w > 0.5) { // жирный чек — добавляем саб-удар под mp3
      const sub = actx.createOscillator(), sg = actx.createGain();
      sub.type = "sine";
      sub.frequency.setValueAtTime(80, t0);
      sub.frequency.exponentialRampToValueAtTime(40, t0 + 0.15);
      sg.gain.setValueAtTime(w * 0.3, t0);
      sg.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
      sub.connect(sg); sg.connect(actx.destination);
      sub.start(t0); sub.stop(t0 + 0.35);
    }
    return;
  }

  // 1) саб-удар: чем жирнее чек, тем глубже и дольше
  const sub = actx.createOscillator(), sg = actx.createGain();
  sub.type = "sine";
  sub.frequency.setValueAtTime(95 - w * 25, t0);
  sub.frequency.exponentialRampToValueAtTime(45 - w * 10, t0 + 0.09 + w * 0.06);
  sg.gain.setValueAtTime(0.16 + w * 0.3, t0);
  sg.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14 + w * 0.2);
  sub.connect(sg); sg.connect(actx.destination);
  sub.start(t0); sub.stop(t0 + 0.4);

  // 2) лазерный zap вверх
  const z = actx.createOscillator(), zf = actx.createBiquadFilter(), zg = actx.createGain();
  z.type = "square";
  z.frequency.setValueAtTime(420 * v, t0);
  z.frequency.exponentialRampToValueAtTime(1900 * v, t0 + 0.09 + w * 0.04);
  zf.type = "lowpass"; zf.frequency.value = 3200;
  zg.gain.setValueAtTime(0.08 + w * 0.08, t0);
  zg.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13 + w * 0.05);
  z.connect(zf); zf.connect(zg); zg.connect(actx.destination);
  z.start(t0); z.stop(t0 + 0.25);

  // 3) искры сверху: у крупного чека — целый каскад
  tone(1760 * v, 0.06, 0.12, 0.05 + w * 0.04);
  tone(2637 * v, 0.1, 0.16, 0.04 + w * 0.04);
  if (w > 0.5) tone(3520 * v, 0.15, 0.2, 0.05);
  if (w > 0.75) { tone(2093 * v, 0.2, 0.25, 0.06); tone(4186 * v, 0.26, 0.3, 0.04); }
}

function sndJackpot() {

  sub.type = "sine";
  sub.frequency.setValueAtTime(80, t0 + 0.72);
  sub.frequency.exponentialRampToValueAtTime(35, t0 + 1.0);
  sg.gain.setValueAtTime(0.5, t0 + 0.72);
  sg.gain.exponentialRampToValueAtTime(0.001, t0 + 1.3);
  sub.connect(sg); sg.connect(actx.destination);

let musicGain = null, masterFilter = null, noiseBuf = null, beatStep = 0, nextNoteTime = 0;
let tempoMult = 1, jackpotBoostUntil = 0;

const BASS_NOTES = [55, 55, 65.4, 49]; // A1 A1 C2 G1 — по тактам

function startMusic() {
  if (musicGain || !actx) return;
  musicGain = actx.createGain();
  musicGain.gain.value = musicMuted ? 0 : 0.5;
  masterFilter = actx.createBiquadFilter();
  masterFilter.type = "lowpass";
  masterFilter.frequency.value = 18000;
  musicGain.connect(masterFilter);
  masterFilter.connect(actx.destination);
  nextNoteTime = actx.currentTime + 0.1;
  setInterval(scheduleMusic, 25);
}
function scheduleMusic() {
  while (nextNoteTime < actx.currentTime + 0.12) {
    playStep(beatStep, nextNoteTime);
    beatStep = (beatStep + 1) % 32;
    nextNoteTime += STEP16 / tempoMult;

// музыка живая: чем больше продаж в минуту, тем больше слоёв
function playStep(s, t) {
  const rate = history.length; // продаж за последнюю минуту
  const boosted = Date.now() < jackpotBoostUntil;
  if (s % 4 === 0) kick(t);
  if (s % 2 === 0) hat(t, s % 4 === 2 ? 0.055 : 0.025);
  if (rate >= 12 && s % 2 === 1) hat(t, 0.018);                      // слой 2: шестнадцатые хэты
  if ((rate >= 25 || boosted) && s % 8 === 4) clap(t, boosted ? 0.15 : 0.1); // слой 3: клэп
  if (BASS_PAT[s]) bass(t, BASS_NOTES[Math.floor(s / 8)]);

  if (s === 28) stab(t);
}
function clap(t, vol) {
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 1.2;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  src.connect(f); f.connect(g); g.connect(musicGain);
  src.start(t); src.stop(t + 0.13);
}
function kick(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + 0.35);
}
function hat(t, vol) {
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 8500;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  src.connect(f); f.connect(g); g.connect(musicGain);
  src.start(t); src.stop(t + 0.06);
}
function bass(t, freq, vol = 0.16) {
  const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = "sawtooth"; o.frequency.value = freq;
  f.type = "lowpass"; f.frequency.value = 420; f.Q.value = 6;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + STEP16 * 0.9);
  o.connect(f); f.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + STEP16);
}
function stab(t) {
  [220, 261.6, 329.6].forEach(fr => {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = "square"; o.frequency.value = fr;
    f.type = "lowpass"; f.frequency.value = 1200;
    g.gain.setValueAtTime(0.035, t);

    o.connect(f); f.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.25);
  });
}

// ---------- engine ----------
function rnd(n) { return Math.floor(Math.random() * n); }
function fmt(n) {
  return "$" + Math.floor(n).toLocaleString("en-US");
}

function scheduleSale(delay) {
  setTimeout(() => { sale(); scheduleSale(currentInterval()); }, delay);
}
function currentInterval() {
  if (Date.now() > hypeUntil) hypeMult = 1;
  const base = baseInterval * Math.pow(0.82, speedLvl - 1) / hypeMult;
  return Math.max(60, base * (0.6 + Math.random() * 0.8));
}

const IDLE_TXT = {
  en: ["Market's quiet. Waiting for the next plot twist…", "Investors are scheming something…", "GPUs humming, tokens dripping…", "Everyone's waiting for your next release…", "Calm before the hype…", "Twitter is suspiciously silent…"],
  ru: ["Рынок спокоен. Ждём следующий поворот…", "Инвесторы что-то затевают…", "GPU гудят, токены капают…", "Все ждут твой следующий релиз…", "Тишина перед хайпом…", "X подозрительно молчит…"]

function setEventIdle() {
  const el = document.getElementById("event");
  el.className = "idle";
  el.querySelector(".e-em").textContent = "📡";
  el.querySelector(".e-txt").textContent = pick(IDLE_TXT);

  const bar = el.querySelector(".e-bar");
  bar.style.transition = "none";
  bar.style.transform = "scaleX(0)";
}
let bannerToken = 0;
function scheduleEvent() {
  setTimeout(fireEvent, 16000 + Math.random() * 22000);
}
// рисует баннер + анимирует таймер-полоску
function paintEvent(emoji, txt, multTxt, good, durMs) {
  const el = document.getElementById("event");
  el.className = good ? "good" : "bad";
  el.querySelector(".e-em").textContent = emoji;
  el.querySelector(".e-txt").textContent = txt;
  el.querySelector(".e-mult").textContent = multTxt;
  const bar = el.querySelector(".e-bar");
  bar.style.transition = "none";
  bar.style.transform = "scaleX(1)";
  void bar.offsetWidth;
  bar.style.transition = `transform ${durMs}ms linear`;
  bar.style.transform = "scaleX(0)";
}
function fireEvent() {
  let i;
  do { i = rnd(EVENTS.length); } while (i === lastEvent);
  lastEvent = i;
  const ev = EVENTS[i];
  const dur = 12000 + Math.random() * 10000;
  const good = ev.mult >= 1;
  const st = STREAMS.find(s => s.id === ev.s);
  const tok = ++bannerToken;

  streamMult[ev.s] = ev.mult; // эффект только на этот поток
  pulseStream(ev.s);
  paintEvent(st.em, L(ev.txt), L(st.name) + " ×" + ev.mult, good, dur);
  good ? sndEventGood() : sndEventBad();
  if (actx && masterFilter) {
    if (good) tempoMult = 1.06;
    else masterFilter.frequency.setTargetAtTime(380, actx.currentTime, 0.2);
  }

  setTimeout(() => {
    streamMult[ev.s] = 1;
    if (tok === bannerToken) {
      tempoMult = 1;
      if (actx && masterFilter) masterFilter.frequency.setTargetAtTime(18000, actx.currentTime, 0.3);
      setEventIdle();
    }
    scheduleEvent();
  }, dur);
}

function sale() {
  const stream = pickStream();
  // у API чек растёт с релизами быстрее (priceMult^g)
  let amt = stream.price * Math.pow(priceMult, stream.g) * ipoMult * (0.85 + Math.random() * 0.5);
  // джекпот ×50 — только в платных потоках (не в Plus)
  const corp = (stream.id !== "plus" && Math.random() < 1 / 90) ? pick(CORP) : null;
  if (corp) amt *= 50;
  balance += amt;
  sales++;
  history.push([Date.now(), amt, stream.id]);
  addPayment(amt, corp, stream);
  floatMoney(amt, corp);
  pulseStream(stream.id);
  if (corp) {
    sndJackpot();
    confetti();
    shakeScreen();
    jackpotBoostUntil = Date.now() + 8000;
    showToast("💰 " + corp + ": " + L(stream.name) + tr(" contract ×50!", " контракт ×50!"));
  } else {
    sndCoin(amt);
  }
  bump();
  checkMilestone();
  checkIPO();
  updateUpgrades();
}

// smooth counter + rpm + конкурент + прогресс IPO
function tick(ts) {
  shownBalance += (balance - shownBalance) * 0.12;
  if (balance - shownBalance < 0.5) shownBalance = balance;
  document.getElementById("balance").textContent = fmt(shownBalance);
  document.getElementById("sales").textContent = sales.toLocaleString("en-US");
  const cutoff = Date.now() - 60000;
  history = history.filter(h => h[0] > cutoff);
  const rpm = history.reduce((s, h) => s + h[1], 0);
  document.getElementById("rpm").textContent = fmt(rpm) + tr("/min", "/мин");

  // $/мин по потокам + высота столбцов относительно максимума
  const per = {}; let maxV = 1;
  STREAMS.forEach(s => per[s.id] = 0);
  history.forEach(h => { if (per[h[2]] !== undefined) per[h[2]] += h[1]; });
  STREAMS.forEach(s => { if (per[s.id] > maxV) maxV = per[s.id]; });
  STREAMS.forEach(s => {
    const r = document.getElementById("srpm-" + s.id);
    const b = document.getElementById("sbar-" + s.id);
    if (r) r.textContent = fmt(per[s.id]) + tr("/m", "/м");
    if (b) b.style.transform = "scaleX(" + (per[s.id] / maxV).toFixed(3) + ")";
  });

  // конкурент зарабатывает ~90% твоего темпа, но никогда не спит
  const dt = lastTick ? Math.min(2, (ts - lastTick) / 1000) : 0;
  lastTick = ts;
  rivalBal += Math.max(rpm / 60 * 0.9, 80) * dt;
  document.getElementById("rivalBal2").textContent = fmt(rivalBal);
  document.getElementById("rivalName2").textContent = rivalName;
  document.getElementById("rivalState").innerHTML =
    balance >= rivalBal ? `<span class="ahead">${tr("you lead", "вы впереди")}</span>` : `<span class="behind">${tr("behind", "позади")}</span>`;

  document.getElementById("ipoBar").style.width = Math.min(100, balance / ipoTarget * 100) + "%";
  document.getElementById("ipoLabel").textContent = tr("🔔 IPO at ", "🔔 IPO при ") + fmt(ipoTarget);

  // раз в секунду освежаем кнопки (кулдаун DevDay, доступность апгрейдов)
  if (!tick._s || ts - tick._s > 950) { tick._s = ts; updateUpgrades(); }
  requestAnimationFrame(tick);
}

function buildMemeCanvas() {
  const S = 1080;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const x = cv.getContext("2d");
  const FONT = '-apple-system, "Segoe UI", Roboto, sans-serif';

  // фон: zinc-950 + лёгкое свечение
  x.fillStyle = "#09090b";
  x.fillRect(0, 0, S, S);
  const grad = x.createRadialGradient(S/2, S*0.38, 80, S/2, S*0.38, S*0.7);
  grad.addColorStop(0, "rgba(5,150,105,0.22)");
  grad.addColorStop(1, "rgba(5,150,105,0)");
  x.fillStyle = grad;
  x.fillRect(0, 0, S, S);

  x.textAlign = "center";

  // эмодзи продукта
  x.font = "170px " + FONT;
  x.fillText(product.em, S/2, 300);

  // название компании (ужимается под ширину)
  let fs = 88;
  x.font = `700 ${fs}px ${FONT}`;
  while (x.measureText(company).width > S - 140 && fs > 40) {
    fs -= 4;
    x.font = `700 ${fs}px ${FONT}`;
  }
  x.fillStyle = "#fafafa";
  x.fillText(company, S/2, 440);

  x.font = "500 44px " + FONT;
  x.fillStyle = "#a1a1aa";
  x.fillText(tr("went public", "вышла на IPO"), S/2, 510);

  // сумма
  x.font = "800 150px " + FONT;
  x.fillStyle = "#10b981";
  x.fillText(fmt(balance), S/2, 680);

  // статы
  const mins = Math.max(1, Math.round((Date.now() - startTime) / 60000));
  x.font = "500 42px " + FONT;
  x.fillStyle = "#d4d4d8";
  x.fillText(`${tr("in", "за")} ${mins} ${tr("min", "мин")} · ${sales.toLocaleString("en-US")} ${tr("sales", "продаж")}`, S/2, 770);

  // rival
  x.font = "500 38px " + FONT;
  x.fillStyle = "#71717a";
  const rivalTxt = balance >= rivalBal ? tr(`rival «${rivalName}» went bankrupt 🪦`, `конкурент «${rivalName}» разорён 🪦`) : tr(`rival «${rivalName}» left in the dust`, `конкурент «${rivalName}» в пыли`);
  x.fillText(rivalTxt, S/2, 840);

  // низ
  x.font = "600 36px " + FONT;
  x.fillStyle = "#52525b";
  x.fillText("💸 Money Machine · chereshna.net", S/2, 990);
  return cv;
}

function buy(kind) {
  if (kind === "gpu" && balance >= speedCost) {
    balance -= speedCost;
    speedLvl++;
    speedCost = Math.round(speedCost * 2.3);
    flash(upgSpeed); sndUpgrade();
  } else if (kind === "model" && balance >= priceCost) {
    balance -= priceCost;
    priceLvl++;
    priceMult *= 1.55;
    priceCost = Math.round(priceCost * 2.6);
    modelCode = MODEL_CODE[Math.min(priceLvl - 1, MODEL_CODE.length - 1)];
    updateBrand();
    flash(upgPrice); sndUpgrade();
    showToast(tr("🧠 Released «" + modelCode + " v" + priceLvl + "» — checks up!", "🧠 Релиз «" + modelCode + " v" + priceLvl + "» — чеки выросли!"));
  } else if (kind === "hype" && Date.now() >= hypeReadyAt) {
    hypeMult = 4;
    hypeUntil = Date.now() + 12000;
    hypeReadyAt = Date.now() + 60000;
    flash(upgHype); sndEventGood(); confetti();
    const tok = ++bannerToken;
    paintEvent("🎤", tr("DevDay! The keynote drops — everything pumps", "DevDay! Кейноут гремит — всё разгоняется"), tr("ALL ×4", "ВСЁ ×4"), true, 12000);
    if (actx && masterFilter) tempoMult = 1.1;
    setTimeout(() => {
      if (tok === bannerToken) { tempoMult = 1; setEventIdle(); }
    }, 12000);
  }
  updateUpgrades();
}

function flash(el) {
  el.classList.remove("flash");

function updateUpgrades() {
  upgSpeed.querySelector(".u-lvl").textContent = "×" + speedLvl;
  upgSpeed.querySelector(".u-cost").textContent = fmt(speedCost);
  upgSpeed.disabled = balance < speedCost;
  upgSpeed.classList.toggle("ready", balance >= speedCost);

  upgPrice.querySelector(".u-lvl").textContent = "v" + priceLvl;
  upgPrice.querySelector(".u-cost").textContent = fmt(priceCost);
  upgPrice.disabled = balance < priceCost;
  upgPrice.classList.toggle("ready", balance >= priceCost);

  const cd = Math.max(0, Math.ceil((hypeReadyAt - Date.now()) / 1000));
  upgHype.querySelector(".u-cost").textContent = cd > 0 ? "⏳ " + cd + tr("s", "с") : tr("Free", "Бесплатно");

    c.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
    c.style.animationDelay = Math.random() * 0.6 + "s";
    c.style.width = c.style.height = (5 + Math.random() * 6) + "px";
    c.style.setProperty("--dx", Math.round(Math.random() * 160 - 80) + "px");
    c.style.setProperty("--spin", Math.round(480 + Math.random() * 600) + "deg");
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// ---------- восстановление сохранения ----------
const sv = JSON.parse(localStorage.getItem("mm") || "null");
if (sv) {
  ipoMult = sv.ipoMult || 1;
  if (sv.run && PRODUCTS[sv.pi]) {
    product = PRODUCTS[sv.pi];
    company = sv.company;
    balance = sv.balance; sales = sv.sales;
    speedLvl = sv.speedLvl; priceLvl = sv.priceLvl;
    speedCost = sv.speedCost; priceCost = sv.priceCost;
    priceMult = sv.priceMult; milestoneIdx = sv.milestoneIdx;
    rivalName = sv.rivalName; rivalBal = sv.rivalBal;
    startTime = sv.startTime;
    modelCode = sv.modelCode || MODEL_CODE[Math.min(priceLvl - 1, MODEL_CODE.length - 1)];
    // аудио по политике браузера стартует после первого клика
    document.addEventListener("pointerdown", () => { initAudio(); startMusic(); }, { once: true });
    startRun();
    setTimeout(() => showToast(tr("🔊 Tap anywhere to turn on sound", "🔊 Нажми в любом месте — включится звук")), 800);
  } else if (ipoMult > 1) {
    const b = document.getElementById("multBadge");
    b.style.display = "block";
    b.textContent = tr("🏆 Empire multiplier: ×", "🏆 Множитель империи: ×") + ipoMult;
  }
}

// ---------- применить язык ----------
applyLang();

// ---------- PWA ----------
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
